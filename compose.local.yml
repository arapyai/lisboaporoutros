services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: lisboa_por_outros_preview
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lisboa_por_outros_preview"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - lisboa-preview-postgres:/var/lib/postgresql/data

volumes:
  lisboa-preview-postgres:
