name: Project CI

on:
  pull_request:
    branches: [ "production", "main", "development" ]
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'webapp/**'
      - 'shared/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'scripts/test-postgres-ux.sh'
      - '.github/workflows/main.yml'
  push:
    branches: [ "production", "main", "development" ]
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'webapp/**'
      - 'shared/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'scripts/test-postgres-ux.sh'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run linting
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests with coverage threshold
        run: uv run pytest --cov=app --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test shared package
        run: npm run shared:test
      - name: Test admin
        run: npm --workspace @ecosdelisboa/admin test
      - name: Build admin
        run: npm --workspace @ecosdelisboa/admin run build
      - name: Test webapp
        run: npm --workspace @ecosdelisboa/webapp test
      - name: Lint webapp
        run: npm --workspace @ecosdelisboa/webapp run lint
      - name: Build webapp
        run: npm --workspace @ecosdelisboa/webapp run build

  postgres-editorial:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install PostgreSQL 16 and PostGIS
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-postgis-3
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Test migrated editorial contracts in a private cluster
        run: bash scripts/test-postgres-ux.sh -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        run: npm run e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
